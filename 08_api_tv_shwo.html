<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Shows de TV</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f7f7f7;
      }
    
      h1 {
        text-align: center;
      }
    
      #search {
        display: block;
        margin: 20px auto;
        padding: 10px;
        width: 80%;
        max-width: 400px;
        font-size: 1rem;
      }
    
      .grid-fluid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 20px;
      }
    
      .show {
        background-color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
    
      .show img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
      }
    
      .show h3 {
        font-size: 1.1rem;
        margin: 10px 0;
        color: #333;
      }
    
      .show a {
        display: inline-block;
        margin-top: 10px;
        text-decoration: none;
        background-color: #007bff;
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        transition: background-color 0.2s ease-in-out;
      }
    
      .show a:hover {
        background-color: #0056b3;
      }
    
      .loader {
        display: block;
        margin: auto;
      }

      .none {
        display: none;
      }
  </style>
</head>

<body>
  <h1>Buscador Shows de TV</h1>
  <input type="search" id="search" placeholder="Buscar shows de tv..." autocomplete="off">

  <div id="loader-container" class="loader-container hidden">
    <img src="./assets/loader.svg" alt="Cargando..." class="loader">
  </div>

  <section id="shows" class="grid-fluid">
  </section>
  <template id="show-template">
    <article class="show">
      <h3></h3> 
      <div></div> 
      <img>
      <a></a>
    </article>
  </template>

  <script src="./assets/js/08_api_tv_show.js"></script>
</body>

</html>
